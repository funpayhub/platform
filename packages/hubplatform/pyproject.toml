[project]
name = "hubplatform"
version = "0.1.0"
requires-python = ">=3.15.2"
dependencies = [
    "aiogram~=3.31.0",
    "aiohttp~=3.14",
    "eventry~=0.7.2",
    "fluent-runtime~=0.4.0",
    "pyconfigtree[toml]~=0.5.1",
    "pydantic~=2.14",
    "uv~=0.13.6",
]


[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
'hubplatform' = [
    '**/*.ftl',
    '**/*.sql'
]
