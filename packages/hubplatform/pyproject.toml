[project]
name = "hubplatform"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "aiogram>=3.31.0, <3.32.0",
    "eventry>=0.7.1",
    "fluent-runtime>=0.4.0, <0.5.0",
    "pyconfigtree[toml]>=0.3.0,<0.4.0",
    "pydantic>=2.13.4",
]


[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"
